gates:
  restore:
    command: dotnet restore Catalog.sln
  build:
    command: dotnet build Catalog.sln --configuration Release --no-restore
  tests:
    command: dotnet test Catalog.sln --configuration Release --no-build
  api-tests:
    command: dotnet test tests/Catalog.Api.Tests/Catalog.Api.Tests.csproj --configuration Release --no-build
  catalog-unit-tests:
    command: dotnet test tests/Catalog.Product.Tests/Catalog.Product.Tests.csproj --configuration Release --no-build
  sql-integration-tests:
    command: RUN_SQL_SERVER_TESTS=true dotnet test tests/Catalog.Product.IntegrationTests/Catalog.Product.IntegrationTests.csproj --configuration Release --no-build
    requiresDocker: true
    database: ephemeral-sql-server
    appliesMigrationsFromCleanDatabase: true
    appliesInitialThenIncremental: true
  architecture-tests:
    command: dotnet test tests/Catalog.Architecture.Tests/Catalog.Architecture.Tests.csproj --configuration Release --no-build
  formatting:
    command: dotnet format Catalog.sln --verify-no-changes --no-restore
  openapi-validation:
    command: dotnet test tests/Catalog.Api.Tests/Catalog.Api.Tests.csproj --configuration Release --no-build --filter Category=OpenApi
  migration-validation:
    command: dotnet ef migrations has-pending-model-changes --project src/Catalog.Accessors/Catalog.Accessors.csproj --startup-project src/Catalog.Api/Catalog.Api.csproj --configuration Release --no-build
  migration-script:
    command: dotnet ef migrations script --idempotent --project src/Catalog.Accessors/Catalog.Accessors.csproj --startup-project src/Catalog.Api/Catalog.Api.csproj --configuration Release --no-build
  pulumi-build:
    command: dotnet build infra/Catalog.Infrastructure/Catalog.Infrastructure.csproj --configuration Release
  preview-guard-self-check:
    command: pwsh ./scripts/tests/preview-guard-check.ps1
    offline: true
    verifies: pulumi-preview-destruction-guard
  pulumi-preview:
    command: pwsh ./scripts/invoke-pulumi-preview.ps1 -PulumiPath <pulumi> -EvidencePath <evidence>
    requiresAzureCli: true
    requiresSecrets:
      - PULUMI_CONFIG_PASSPHRASE
    blocksDeploymentOnProtectedResourceDestruction: true
    protectedResourceTypes:
      - azure-native:sql:Server
      - azure-native:sql:Database
      - azure-native:containerregistry:Registry
      - azure-native:keyvault:Vault
      - azure-native:managedidentity:UserAssignedIdentity
      - azure-native:operationalinsights:Workspace
      - azure-native:insights:Component
      - azure-native:app:ManagedEnvironment
      - azure-native:app:ContainerApp
      - azure-native:resources:ResourceGroup
  container-builds:
    command: pwsh ./scripts/deploy-dev.ps1
    provider: azure-container-registry-tasks
    localDockerRequired: false
  database-migration-job:
    command: pwsh ./scripts/run-migrations-dev.ps1
    blocksSmokeTestsOnFailure: true
  deployment-smoke-tests:
    command: pwsh ./scripts/smoke-test-dev.ps1
    methods:
      - GET
    endpoints:
      - /health
      - /products
      - /categories

# Which gates each Azure Pipelines stage enforces, and which stages a pull request may run.
pipeline:
  definition: azure-pipelines.yml
  stages:
    Validate:
      runsOnPullRequest: true
      gates:
        - restore
        - build
        - catalog-unit-tests
        - api-tests
        - architecture-tests
        - openapi-validation
        - sql-integration-tests
        - migration-validation
        - migration-script
        - formatting
        - preview-guard-self-check
        - pulumi-build
    InfrastructurePreview:
      runsOnPullRequest: true
      gates:
        - pulumi-preview
    BuildImages:
      runsOnPullRequest: false
      gates:
        - container-builds
    Deploy:
      runsOnPullRequest: false
      gates:
        - pulumi-preview
    RunMigrations:
      runsOnPullRequest: false
      gates:
        - database-migration-job
    SmokeTests:
      runsOnPullRequest: false
      gates:
        - deployment-smoke-tests
    PublishEvidence:
      runsOnPullRequest: true
      gates: []
