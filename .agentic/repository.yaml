id: REPO-COMMERCE-CATALOG
name: agentic-commerce-catalog
domain: catalog
type: cloudflare-worker
language: typescript
defaultBranch: main

services:
  - SERVICE-CATALOG-API

commands:
  install: npm ci
  dev: npm run dev
  typecheck: npm run typecheck
  lint: npm run lint
  test: npm test
  check: npm run check
  migrateLocal: npm run db:migrate:local
  migrateRemote: npm run db:migrate:remote
  deploy: npm run deploy
  verifyHealth: npm run verify:health

qualityGates:
  - typecheck
  - lint
  - unit-tests
  - integration-tests
  - openapi-validation
