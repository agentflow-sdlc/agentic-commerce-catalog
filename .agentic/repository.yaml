id: REPO-COMMERCE-CATALOG
name: agentic-commerce-catalog
repository: agentflow-sdlc/agentic-commerce-catalog
domain: catalog
type: aspnet-core-api
language: csharp
framework: dotnet-10
defaultBranch: main

administration:
  system: azure-devops
  responsibilities:
    - boards
    - pipelines
    - states
    - evidence

sourceControl:
  system: github
  responsibilities:
    - repository
    - branches
    - commits
    - pull-requests

ciCd:
  system: azure-pipelines
  definition: azure-pipelines.yml

services:
  - SERVICE-CATALOG-API

commands:
  toolRestore: dotnet tool restore
  restore: dotnet restore Catalog.sln
  build: dotnet build Catalog.sln --configuration Release --no-restore
  test: dotnet test Catalog.sln --configuration Release --no-build
  sqlIntegrationTest: RUN_SQL_SERVER_TESTS=true dotnet test tests/Catalog.Product.IntegrationTests/Catalog.Product.IntegrationTests.csproj --configuration Release --no-build
  migrationAdd: dotnet ef migrations add <Name> --project src/Catalog.Accessors/Catalog.Accessors.csproj --startup-project src/Catalog.Api/Catalog.Api.csproj --output-dir Migrations
  databaseUpdate: dotnet ef database update --project src/Catalog.Accessors/Catalog.Accessors.csproj --startup-project src/Catalog.Api/Catalog.Api.csproj
  formatCheck: dotnet format Catalog.sln --verify-no-changes --no-restore
  openApiValidation: dotnet test tests/Catalog.Api.Tests/Catalog.Api.Tests.csproj --configuration Release --no-build --filter Category=OpenApi
  migrationValidation: dotnet ef migrations has-pending-model-changes --project src/Catalog.Accessors/Catalog.Accessors.csproj --startup-project src/Catalog.Api/Catalog.Api.csproj --configuration Release --no-build
  migrationScript: dotnet ef migrations script --idempotent --project src/Catalog.Accessors/Catalog.Accessors.csproj --startup-project src/Catalog.Api/Catalog.Api.csproj --configuration Release --no-build
  pulumiBuild: dotnet build infra/Catalog.Infrastructure/Catalog.Infrastructure.csproj --configuration Release
  bootstrapPulumi: pwsh ./scripts/bootstrap-pulumi.ps1
  deployDev: pwsh ./scripts/deploy-dev.ps1
  migrateDev: pwsh ./scripts/run-migrations-dev.ps1
  smokeTestDev: pwsh ./scripts/smoke-test-dev.ps1

requirements:
  sqlIntegrationTests:
    docker: required
    sharedAzureDatabase: prohibited
    migrationStrategy: initial-then-latest-on-clean-database

features:
  implemented:
    - health
    - product-create
    - product-get-by-id
    - product-list
    - product-status
    - category-create
    - category-list
    - optional-product-category-association
    - azure-dev-infrastructure
    - immutable-container-images
    - container-apps-api
    - container-apps-database-migrator
    - application-insights
    - azure-sql-private-endpoint
  pending:
    - external-playwright
    - agents

qualityGates:
  - restore
  - build
  - api-tests
  - catalog-unit-tests
  - sql-integration-tests
  - architecture-tests
  - formatting
  - openapi-validation
  - migration-validation
  - migration-script
  - pulumi-build
  - pulumi-preview
  - container-builds
  - database-migration-job
  - deployment-smoke-tests
