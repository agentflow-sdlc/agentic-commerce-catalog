service: SERVICE-CATALOG-API
entryPoint: src/Catalog.Api/Program.cs
publicContract: openapi/catalog-api.yaml

components:
  contracts:
    project: src/Catalog.Contracts/Catalog.Contracts.csproj
    responsibilities:
      - stable-http-contracts
    allowedDependencies: []
  api:
    project: src/Catalog.Api/Catalog.Api.csproj
    responsibilities:
      - aspnet-core-entry-point
      - dependency-composition
      - http-translation
      - middleware
      - health
      - development-openapi
    allowedDependencies:
      - contracts
      - managers-when-use-cases-exist
  managers:
    project: src/Catalog.Managers/Catalog.Managers.csproj
    responsibilities:
      - future-use-case-coordination
    allowedDependencies:
      - contracts
      - engines
      - required-accessors
  engines:
    project: src/Catalog.Engines/Catalog.Engines.csproj
    responsibilities:
      - future-deterministic-business-rules
    allowedDependencies:
      - contracts-when-required
  accessors:
    project: src/Catalog.Accessors/Catalog.Accessors.csproj
    responsibilities:
      - future-sql-access
      - future-file-access
      - future-api-access
      - future-information-container-access
    allowedDependencies:
      - required-provider-libraries

forbiddenDependencies:
  - from: contracts
    to:
      - api
      - managers
      - engines
      - accessors
      - aspnet-core
      - azure
      - persistence
  - from: engines
    to:
      - api
      - accessors
      - aspnet-core
      - entity-framework-core
      - azure
      - sql
  - from: managers
    to:
      - aspnet-core
  - from: api
    to:
      - direct-accessors-for-use-cases

endpoints:
  implemented:
    - method: GET
      path: /health
  pending:
    - method: POST
      path: /products
    - method: GET
      path: /products
    - method: GET
      path: /products/{id}
    - method: PATCH
      path: /products/{id}/status
    - method: POST
      path: /categories
    - method: GET
      path: /categories

persistence:
  status: pending
  boundary: Catalog.Accessors
  providers: []
