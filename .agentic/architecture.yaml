service: SERVICE-CATALOG-API
entryPoint: src/Catalog.Api/Program.cs
publicContract: openapi/catalog-api.yaml

components:
  contracts:
    project: src/Catalog.Contracts/Catalog.Contracts.csproj
    responsibilities:
      - stable-http-contracts
    allowedDependencies: []
  api:
    project: src/Catalog.Api/Catalog.Api.csproj
    responsibilities:
      - aspnet-core-entry-point
      - dependency-composition
      - http-translation
      - middleware
      - health
      - product-endpoints
      - category-endpoints
      - development-openapi
    allowedDependencies:
      - contracts
      - managers
      - accessors-composition-only
  managers:
    project: src/Catalog.Managers/Catalog.Managers.csproj
    responsibilities:
      - product-use-case-coordination
      - category-use-case-coordination
    allowedDependencies:
      - engines-and-domain-ports
  engines:
    project: src/Catalog.Engines/Catalog.Engines.csproj
    responsibilities:
      - product-domain-model
      - category-domain-model
      - deterministic-product-rules
      - deterministic-category-rules
      - stable-product-id-validation
      - neutral-accessor-ports
    allowedDependencies: []
  accessors:
    project: src/Catalog.Accessors/Catalog.Accessors.csproj
    responsibilities:
      - sql-access
      - future-file-access
      - future-api-access
      - future-information-container-access
    allowedDependencies:
      - engines-and-domain-ports
      - required-provider-libraries
  database-migrator:
    project: src/Catalog.DatabaseMigrator/Catalog.DatabaseMigrator.csproj
    responsibilities:
      - one-shot-ef-core-migrations
      - non-http-process
    allowedDependencies:
      - accessors
      - generic-host
  infrastructure:
    project: infra/Catalog.Infrastructure/Catalog.Infrastructure.csproj
    responsibilities:
      - pulumi-azure-native
      - dev-cloud-resources
      - workload-composition
    allowedDependencies:
      - pulumi
      - azure-native

forbiddenDependencies:
  - from: contracts
    to:
      - api
      - managers
      - engines
      - accessors
      - aspnet-core
      - azure
      - persistence
  - from: engines
    to:
      - api
      - accessors
      - aspnet-core
      - entity-framework-core
      - azure
      - sql
  - from: managers
    to:
      - accessors
      - aspnet-core
      - entity-framework-core
      - azure
      - sql
  - from: api
    to:
      - direct-accessor-invocation
      - entity-framework-core
      - sql-client
      - pulumi
      - infrastructure
      - database-migrator
  - from: database-migrator
    to:
      - aspnet-core
      - http-endpoints
      - infrastructure
      - pulumi
  - from: production-projects
    to:
      - infrastructure
      - pulumi

endpoints:
  implemented:
    - method: GET
      path: /health
    - method: POST
      path: /products
    - method: GET
      path: /products/{id}
    - method: GET
      path: /products
    - method: PATCH
      path: /products/{id}/status
    - method: POST
      path: /categories
    - method: GET
      path: /categories
  pending: []

persistence:
  status: product-category-parity
  boundary: Catalog.Accessors
  provider: ef-core-sql-server
  azureSqlCompatible: true
  connectionString: CatalogDb
  migrations:
    - src/Catalog.Accessors/Migrations/20260805214332_InitialProduct.cs
    - src/Catalog.Accessors/Migrations/20260806153200_AddCategoriesAndProductCategory.cs
  constraints:
    - unique-product-sku
    - unique-category-normalized-name
    - nullable-product-category-foreign-key
  integrationTests:
    strategy: ephemeral-sql-server-testcontainer
    dockerRequired: true

deployment:
  environment: dev
  runtime: azure-container-apps
  infrastructure: pulumi-csharp-azure-native
  backend: azure-blob-existing
  stack: dev
  secretsProvider: passphrase
  registry: azure-container-registry-basic
  database: azure-sql-basic-private-endpoint
  sqlRegion: configurable-subscription-enabled-region
  secretDelivery: key-vault-managed-identity
  migrations: container-apps-manual-job
  smokeTests:
    - GET /health
    - GET /products
    - GET /categories

cicd:
  sourceControl: github
  orchestrator: github-actions
  azurePipelines: none
  definition: .github/workflows/ci-cd.yml
  azureAuthentication: workload-identity-federation-oidc
  flows:
    pullRequest:
      description: GitHub pull request into main triggers GitHub Actions validation only.
      path:
        - github-pull-request
        - github-actions
        - validate
        - pulumi-preview
        - evidence
      deploys: false
    main:
      description: Push to GitHub main triggers the full Azure deployment.
      path:
        - github-main
        - github-actions
        - validate
        - pulumi-preview
        - build-images
        - azure-container-registry
        - pulumi-up
        - azure-container-apps
        - database-migration-job
        - smoke-tests
        - evidence
      deploys: true
  safeguards:
    previewBeforeEveryUpdate: true
    failOnProtectedResourceDestruction: true
    destroyProhibited: true
    immutableImageTags: true
    latestTagProhibited: true
    apiRunsMigrationsAtStartup: false

runtimeAbstractions:
  time: System.TimeProvider
  productIds: Catalog.Managers.Products.IProductIdGenerator
  categoryIds: Catalog.Managers.Categories.ICategoryIdGenerator

errors:
  functionalValidation: PRODUCT_VALIDATION_FAILED
  duplicateSku: PRODUCT_SKU_ALREADY_EXISTS
  productNotFound: PRODUCT_NOT_FOUND
  categoryValidation: CATEGORY_VALIDATION_FAILED
  duplicateCategoryName: CATEGORY_NAME_ALREADY_EXISTS
  categoryNotFound: CATEGORY_NOT_FOUND
  unexpected: UNEXPECTED_ERROR
