service: SERVICE-CATALOG-API
entryPoint: src/Catalog.Api/Program.cs
publicContract: openapi/catalog-api.yaml

components:
  contracts:
    project: src/Catalog.Contracts/Catalog.Contracts.csproj
    responsibilities:
      - stable-http-contracts
    allowedDependencies: []
  api:
    project: src/Catalog.Api/Catalog.Api.csproj
    responsibilities:
      - aspnet-core-entry-point
      - dependency-composition
      - http-translation
      - middleware
      - health
      - product-endpoints
      - development-openapi
    allowedDependencies:
      - contracts
      - managers
      - accessors-composition-only
  managers:
    project: src/Catalog.Managers/Catalog.Managers.csproj
    responsibilities:
      - product-use-case-coordination
    allowedDependencies:
      - engines-and-domain-ports
  engines:
    project: src/Catalog.Engines/Catalog.Engines.csproj
    responsibilities:
      - product-domain-model
      - deterministic-product-rules
      - neutral-accessor-ports
    allowedDependencies: []
  accessors:
    project: src/Catalog.Accessors/Catalog.Accessors.csproj
    responsibilities:
      - sql-access
      - future-file-access
      - future-api-access
      - future-information-container-access
    allowedDependencies:
      - engines-and-domain-ports
      - required-provider-libraries

forbiddenDependencies:
  - from: contracts
    to:
      - api
      - managers
      - engines
      - accessors
      - aspnet-core
      - azure
      - persistence
  - from: engines
    to:
      - api
      - accessors
      - aspnet-core
      - entity-framework-core
      - azure
      - sql
  - from: managers
    to:
      - accessors
      - aspnet-core
      - entity-framework-core
      - azure
      - sql
  - from: api
    to:
      - direct-accessor-invocation
      - entity-framework-core
      - sql-client

endpoints:
  implemented:
    - method: GET
      path: /health
    - method: POST
      path: /products
    - method: GET
      path: /products/{id}
  pending:
    - method: GET
      path: /products
    - method: PATCH
      path: /products/{id}/status
    - method: POST
      path: /categories
    - method: GET
      path: /categories

persistence:
  status: implemented-for-product
  boundary: Catalog.Accessors
  provider: ef-core-sql-server
  azureSqlCompatible: true
  connectionString: CatalogDb
  migration: src/Catalog.Accessors/Migrations/20260805214332_InitialProduct.cs
