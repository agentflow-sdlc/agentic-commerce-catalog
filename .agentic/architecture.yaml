service: SERVICE-CATALOG-API
entryPoint: src/Clients/Api/Program.cs
publicContract: openapi/catalog-api.yaml

architecture: clean-architecture
dependencyRule: references point inward only (clients -> infrastructure -> application -> domain)

components:
  domain:
    project: src/Domain/Catalog.Domain.csproj
    responsibilities:
      - product-domain-model
      - category-domain-model
      - deterministic-product-rules
      - deterministic-category-rules
      - stable-product-id-validation
    allowedDependencies: []
  application:
    project: src/Application/Catalog.Application.csproj
    responsibilities:
      - product-use-cases
      - category-use-cases
      - repository-ports
    useCases:
      - CreateProduct
      - ListProducts
      - GetProduct
      - SetProductStatus
      - CreateCategory
      - ListCategories
    allowedDependencies:
      - domain
  infrastructure-sql:
    project: src/Infrastructure/Sql/Catalog.Infrastructure.Sql.csproj
    responsibilities:
      - sql-repositories
      - ef-core-migrations
    allowedDependencies:
      - application
      - domain
      - required-provider-libraries
  api:
    project: src/Clients/Api/Catalog.Clients.Api.csproj
    responsibilities:
      - aspnet-core-entry-point
      - dependency-composition
      - http-contracts
      - http-translation
      - middleware
      - health
      - product-endpoints
      - category-endpoints
      - development-openapi
    allowedDependencies:
      - application
      - infrastructure-sql-composition-only
  database-migrator:
    project: src/Clients/DatabaseMigrator/Catalog.Clients.DatabaseMigrator.csproj
    responsibilities:
      - one-shot-ef-core-migrations
      - non-http-process
    allowedDependencies:
      - infrastructure-sql
      - generic-host
  pulumi:
    project: infra/Catalog.Infrastructure/Catalog.Infrastructure.csproj
    responsibilities:
      - pulumi-azure-native
      - dev-cloud-resources
      - workload-composition
    allowedDependencies:
      - pulumi
      - azure-native

forbiddenDependencies:
  - from: domain
    to:
      - application
      - infrastructure-sql
      - api
      - aspnet-core
      - entity-framework-core
      - azure
      - sql
  - from: application
    to:
      - infrastructure-sql
      - api
      - aspnet-core
      - entity-framework-core
      - azure
      - sql
  - from: infrastructure-sql
    to:
      - api
      - aspnet-core
  - from: api
    to:
      - direct-repository-invocation
      - entity-framework-core
      - sql-client
      - pulumi
      - database-migrator
  - from: database-migrator
    to:
      - aspnet-core
      - http-endpoints
      - pulumi
  - from: production-projects
    to:
      - pulumi

endpoints:
  implemented:
    - method: GET
      path: /health
    - method: POST
      path: /products
    - method: GET
      path: /products/{id}
    - method: GET
      path: /products
    - method: PATCH
      path: /products/{id}/status
    - method: POST
      path: /categories
    - method: GET
      path: /categories
  pending: []

persistence:
  status: product-category-parity
  boundary: Catalog.Infrastructure.Sql
  provider: ef-core-sql-server
  azureSqlCompatible: true
  connectionString: CatalogDb
  migrations:
    - src/Infrastructure/Sql/Migrations/20260805214332_InitialProduct.cs
    - src/Infrastructure/Sql/Migrations/20260806153200_AddCategoriesAndProductCategory.cs
  constraints:
    - unique-product-sku
    - unique-category-normalized-name
    - nullable-product-category-foreign-key
  integrationTests:
    strategy: ephemeral-sql-server-testcontainer
    dockerRequired: true

deployment:
  environment: dev
  runtime: azure-container-apps
  infrastructure: pulumi-csharp-azure-native
  backend: azure-blob-existing
  stack: dev
  secretsProvider: passphrase
  registry: azure-container-registry-basic
  database: azure-sql-basic-private-endpoint
  sqlRegion: configurable-subscription-enabled-region
  secretDelivery: key-vault-managed-identity
  migrations: container-apps-manual-job
  smokeTests:
    - GET /health
    - GET /products
    - GET /categories

cicd:
  sourceControl: github
  orchestrator: github-actions
  azurePipelines: none
  definition: .github/workflows/ci-cd.yml
  azureAuthentication: workload-identity-federation-oidc
  flows:
    pullRequest:
      description: GitHub pull request into main triggers GitHub Actions validation only.
      path:
        - github-pull-request
        - github-actions
        - validate
        - pulumi-preview
        - evidence
      deploys: false
    main:
      description: Push to GitHub main triggers the full Azure deployment.
      path:
        - github-main
        - github-actions
        - validate
        - pulumi-preview
        - build-images
        - azure-container-registry
        - pulumi-up
        - azure-container-apps
        - database-migration-job
        - smoke-tests
        - evidence
      deploys: true
  safeguards:
    previewBeforeEveryUpdate: true
    failOnProtectedResourceDestruction: true
    destroyProhibited: true
    immutableImageTags: true
    latestTagProhibited: true
    apiRunsMigrationsAtStartup: false

runtimeAbstractions:
  time: System.TimeProvider
  productIds: Catalog.Application.Products.IProductIdGenerator
  categoryIds: Catalog.Application.Categories.ICategoryIdGenerator

errors:
  functionalValidation: PRODUCT_VALIDATION_FAILED
  duplicateSku: PRODUCT_SKU_ALREADY_EXISTS
  productNotFound: PRODUCT_NOT_FOUND
  categoryValidation: CATEGORY_VALIDATION_FAILED
  duplicateCategoryName: CATEGORY_NAME_ALREADY_EXISTS
  categoryNotFound: CATEGORY_NOT_FOUND
  unexpected: UNEXPECTED_ERROR
