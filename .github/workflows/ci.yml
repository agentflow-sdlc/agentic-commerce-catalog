name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Catalog
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run all validations
        run: npm run check
