# Catalog CI/CD — GitHub Actions is the only CI/CD definition.
#
#   Pull request -> main
#     validate -> infrastructure-preview -> publish-evidence          (never deploys)
#
#   Push to main
#     validate -> infrastructure-preview -> build-images -> deploy
#     -> run-migrations -> smoke-tests -> publish-evidence
#
# Azure access uses OIDC (workload identity federation) through azure/login.
# There is no client secret, no PAT and no storage account key in this workflow.
# PULUMI_CONFIG_PASSPHRASE and CATALOG_SQL_ADMIN_PASSWORD are GitHub secrets and are
# referenced, never written, here.

name: ci-cd

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# OIDC needs id-token: write. Everything else stays read-only.
permissions:
  contents: read
  id-token: write

concurrency:
  # Never let two runs mutate the shared dev stack at the same time. Pull request runs
  # supersede each other; main deployments queue instead of cancelling.
  group: catalog-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUILD_CONFIGURATION: Release
  PULUMI_VERSION: 3.255.0

jobs:
  # -------------------------------------------------------------------------------
  # 1. validate — every quality gate, identical for pull requests and for main.
  # -------------------------------------------------------------------------------
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Prepare evidence directory
        run: mkdir -p evidence/test-results

      - name: Restore repository tools
        run: dotnet tool restore

      - name: dotnet restore
        run: dotnet restore Catalog.sln

      - name: dotnet build
        run: dotnet build Catalog.sln --configuration "$BUILD_CONFIGURATION" --no-restore

      - name: Unit tests
        run: >-
          dotnet test tests/Catalog.Product.Tests/Catalog.Product.Tests.csproj
          --configuration "$BUILD_CONFIGURATION" --no-build
          --logger "trx;LogFileName=Catalog.UnitTests.trx"
          --results-directory evidence/test-results

      - name: API tests
        run: >-
          dotnet test tests/Catalog.Api.Tests/Catalog.Api.Tests.csproj
          --configuration "$BUILD_CONFIGURATION" --no-build
          --logger "trx;LogFileName=Catalog.ApiTests.trx"
          --results-directory evidence/test-results

      - name: Architecture tests (IDesign dependency rules)
        run: >-
          dotnet test tests/Catalog.Architecture.Tests/Catalog.Architecture.Tests.csproj
          --configuration "$BUILD_CONFIGURATION" --no-build
          --logger "trx;LogFileName=Catalog.ArchitectureTests.trx"
          --results-directory evidence/test-results

      - name: OpenAPI contract validation
        run: >-
          dotnet test tests/Catalog.Api.Tests/Catalog.Api.Tests.csproj
          --configuration "$BUILD_CONFIGURATION" --no-build
          --filter Category=OpenApi
          --logger "trx;LogFileName=Catalog.OpenApiValidation.trx"
          --results-directory evidence/test-results

      - name: Integration tests (isolated SQL Server)
        env:
          RUN_SQL_SERVER_TESTS: "true"
        run: >-
          dotnet test tests/Catalog.Product.IntegrationTests/Catalog.Product.IntegrationTests.csproj
          --configuration "$BUILD_CONFIGURATION" --no-build
          --logger "trx;LogFileName=Catalog.IntegrationTests.trx"
          --results-directory evidence/test-results

      - name: Validate EF Core migration model
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/Catalog.Accessors/Catalog.Accessors.csproj
          --startup-project src/Catalog.Api/Catalog.Api.csproj
          --configuration "$BUILD_CONFIGURATION" --no-build

      - name: Generate idempotent migration evidence
        run: >-
          dotnet ef migrations script --idempotent
          --project src/Catalog.Accessors/Catalog.Accessors.csproj
          --startup-project src/Catalog.Api/Catalog.Api.csproj
          --configuration "$BUILD_CONFIGURATION" --no-build
          --output evidence/Catalog.Migrations.sql

      - name: dotnet format --verify-no-changes
        run: dotnet format Catalog.sln --verify-no-changes --no-restore

      - name: Verify Pulumi destruction guard
        shell: pwsh
        run: ./scripts/tests/preview-guard-check.ps1

      - name: Restore Pulumi C# packages
        run: dotnet restore infra/Catalog.Infrastructure/Catalog.Infrastructure.csproj

      - name: Build Pulumi C# project
        run: >-
          dotnet build infra/Catalog.Infrastructure/Catalog.Infrastructure.csproj
          --configuration "$BUILD_CONFIGURATION" --no-restore

      - name: Publish validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-validate
          path: evidence
          if-no-files-found: warn

  # -------------------------------------------------------------------------------
  # 2. infrastructure-preview — read-only. Runs for pull requests AND for main.
  #    Never calls `pulumi up`; fails if protected infrastructure would be destroyed.
  # -------------------------------------------------------------------------------
  infrastructure-preview:
    name: Infrastructure Preview
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install pinned Pulumi CLI
        run: |
          set -euo pipefail
          curl -fsSL https://get.pulumi.com | sh -s -- --version "$PULUMI_VERSION"
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Preview the existing dev stack
        shell: pwsh
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          CATALOG_SQL_ADMIN_PASSWORD: ${{ secrets.CATALOG_SQL_ADMIN_PASSWORD }}
        run: |
          # bootstrap-pulumi.ps1 discovers the existing Azure Blob backend, logs in and
          # selects the existing `dev` stack. It never initialises a new stack when one
          # exists and never changes the passphrase secrets provider.
          $context = ./scripts/bootstrap-pulumi.ps1 -PassThru
          $guard = (Resolve-Path ./scripts/invoke-pulumi-preview.ps1).Path
          $evidence = Join-Path $PWD 'evidence/pulumi-preview.json'
          Push-Location ./infra/Catalog.Infrastructure
          try {
            # Preview only. No `pulumi up`, no `pulumi destroy`.
            # Azure Container Registry is retired by the free-first profile, which does not
            # provision it at all, so its removal is expected rather than a surprise. Every
            # other protected type still fails the job. See docs/azure-cost-optimization.md.
            # Comments must stay above this call: inside the backtick continuation they
            # end the statement and the next argument is parsed as its own command.
            & $guard -PulumiPath $context.PulumiPath -EvidencePath $evidence `
              -Label 'infrastructure-preview' `
              -AllowedDeletionTypes 'azure-native:containerregistry:Registry'
          }
          finally {
            Pop-Location
          }

      - name: Publish preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-infrastructure-preview
          path: evidence
          if-no-files-found: warn

  # -------------------------------------------------------------------------------
  # 3. build-images — main only. Images live in GitHub Container Registry, which is free
  #    for public packages, instead of Azure Container Registry, which costs a fixed
  #    monthly amount whether or not anything pulls from it.
  #
  #    This job also guarantees the ordering the ACR retirement depends on: the packages
  #    are pushed, made public, and an ANONYMOUS pull is proven to work before `deploy`
  #    is allowed to run. `deploy` is what removes ACR, so a failure here leaves it alive.
  # -------------------------------------------------------------------------------
  build-images:
    name: Build Images
    needs: infrastructure-preview
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    outputs:
      apiImage: ${{ steps.images.outputs.apiImage }}
      migratorImage: ${{ steps.images.outputs.migratorImage }}
      imageTag: ${{ steps.images.outputs.imageTag }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and publish public GHCR images
        id: images
        shell: pwsh
        env:
          # GITHUB_TOKEN is enough to push and expires with the job, so no personal access
          # token is created and no standing registry credential exists.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          $owner = $env:OWNER.ToLowerInvariant()
          $registry = "ghcr.io/$owner"
          $tag = "${{ github.run_id }}-$('${{ github.sha }}'.Substring(0, 12))"

          $env:GITHUB_TOKEN | docker login ghcr.io --username '${{ github.actor }}' --password-stdin
          if ($LASTEXITCODE -ne 0) { throw 'Could not authenticate to ghcr.io.' }

          $images = @(
            @{ Repository = 'catalog-api';               Dockerfile = 'Dockerfile' }
            @{ Repository = 'catalog-database-migrator'; Dockerfile = 'src/Catalog.DatabaseMigrator/Dockerfile' }
          )

          foreach ($image in $images) {
            $reference = "$registry/$($image.Repository):$tag"

            docker build --platform linux/amd64 --file $image.Dockerfile --tag $reference .
            if ($LASTEXITCODE -ne 0) { throw "$($image.Repository) image build failed." }

            docker push $reference
            if ($LASTEXITCODE -ne 0) { throw "$($image.Repository) image push failed." }
          }

          "imageTag=$tag" | Add-Content $env:GITHUB_OUTPUT
          "apiImage=$registry/catalog-api:$tag" | Add-Content $env:GITHUB_OUTPUT
          "migratorImage=$registry/catalog-database-migrator:$tag" | Add-Content $env:GITHUB_OUTPUT

      - name: Make the packages public (best effort)
        shell: pwsh
        env:
          # GITHUB_TOKEN carries `packages: write`, which is enough to push but NOT to
          # change visibility - that needs `admin:packages`, so this call returns 404 and
          # is best effort only. Package visibility is a one-time setting that persists
          # across pushes, so it only ever has to be done once, by hand or with a token
          # that has the scope. The anonymous pull check below is the real gate.
          GH_TOKEN: ${{ secrets.GHCR_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          foreach ($package in 'catalog-api', 'catalog-database-migrator') {
            gh api --method PATCH "orgs/${{ github.repository_owner }}/packages/container/$package" `
              -f visibility=public 2>&1 | Out-Host

            if ($LASTEXITCODE -ne 0) {
              Write-Host "::warning::Could not set '$package' visibility automatically (expected with GITHUB_TOKEN)."
            }
          }

          # Without this the step fails purely because the last native command failed,
          # even though every failure above is deliberately tolerated.
          $global:LASTEXITCODE = 0

      - name: Verify an anonymous pull works
        shell: pwsh
        env:
          API_IMAGE: ${{ steps.images.outputs.apiImage }}
          MIGRATOR_IMAGE: ${{ steps.images.outputs.migratorImage }}
        run: |
          # This is the gate that protects the ACR retirement. Azure Container Apps pulls
          # these images with no credential at all, so if an unauthenticated client cannot
          # pull them, neither can Azure - and `deploy` must not proceed to delete ACR.
          docker logout ghcr.io | Out-Null

          foreach ($reference in $env:API_IMAGE, $env:MIGRATOR_IMAGE) {
            docker pull $reference
            if ($LASTEXITCODE -ne 0) {
              $package = (($reference -split '/')[-1] -split ':')[0]
              $settings = "https://github.com/orgs/${{ github.repository_owner }}/packages/container/$package/settings"
              $message = @(
                "Anonymous pull of '$reference' failed, so Azure Container Apps could not pull it either."
                "The deployment is stopped here, before Azure Container Registry is removed."
                ""
                "The image itself pushed fine - the package is simply still private. GHCR packages are"
                "private on first push even when the repository is public, and GITHUB_TOKEN cannot"
                "change that because it needs admin:packages."
                ""
                "Fix it once and it persists for every future push:"
                "  $settings -> Danger Zone -> Change visibility -> Public"
                ""
                "Then re-run this workflow."
              ) -join [Environment]::NewLine

              throw $message
            }

            Write-Host "Anonymous pull of '$reference' succeeded."
          }

  # -------------------------------------------------------------------------------
  # 4. deploy — main only. Updates the EXISTING stack; creates nothing in parallel.
  # -------------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: build-images
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      catalogUrl: ${{ steps.deploy.outputs.catalogUrl }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install pinned Pulumi CLI
        run: |
          set -euo pipefail
          curl -fsSL https://get.pulumi.com | sh -s -- --version "$PULUMI_VERSION"
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Preview, verify, then update the existing stack
        id: deploy
        shell: pwsh
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          CATALOG_SQL_ADMIN_PASSWORD: ${{ secrets.CATALOG_SQL_ADMIN_PASSWORD }}
          API_IMAGE: ${{ needs.build-images.outputs.apiImage }}
          MIGRATOR_IMAGE: ${{ needs.build-images.outputs.migratorImage }}
        run: |
          $context = ./scripts/bootstrap-pulumi.ps1 -PassThru
          $guard = (Resolve-Path ./scripts/invoke-pulumi-preview.ps1).Path
          $evidence = Join-Path $PWD 'evidence/pulumi-preview-deploy.json'
          $summaryPath = Join-Path $PWD 'evidence/pulumi-update-summary.json'
          New-Item -ItemType Directory -Path (Join-Path $PWD 'evidence') -Force | Out-Null
          Push-Location ./infra/Catalog.Infrastructure
          try {
            # Keep the existing foundation/workload switch; enable the workload and pin
            # the exact immutable images produced by build-images.
            #
            # These writes land in the runner's copy of Pulumi.dev.yaml and are discarded
            # with the runner, so the committed file has to keep deployWorkload=true.
            # Otherwise the next preview plans to delete the workload. See "Stack
            # configuration is committed" in README.md.
            & $context.PulumiPath config set catalog:apiImage $env:API_IMAGE --non-interactive
            & $context.PulumiPath config set catalog:migratorImage $env:MIGRATOR_IMAGE --non-interactive
            & $context.PulumiPath config set catalog:deployWorkload true --non-interactive

            # Hard gate: throws and fails the job if SQL, ACR, Key Vault, the identity,
            # the workspace, App Insights, the environment or the container app would be
            # deleted or replaced. `pulumi up` is only reached when the preview is safe.
            # The registry is retired here on purpose, and only after build-images proved
            # an anonymous GHCR pull works. Every other protected type still fails the job.
            # Comments must stay above this call: inside the backtick continuation they
            # end the statement and the next argument is parsed as its own command.
            & $guard -PulumiPath $context.PulumiPath -EvidencePath $evidence `
              -Label 'deployment-preview' `
              -AllowedDeletionTypes 'azure-native:containerregistry:Registry'

            & $context.PulumiPath up --yes --non-interactive
            if ($LASTEXITCODE -ne 0) { throw 'Pulumi update failed.' }

            # Outputs carry no secrets (names and the public HTTPS URL only).
            $outputs = & $context.PulumiPath stack output --json | ConvertFrom-Json
            $outputs | ConvertTo-Json -Depth 10 |
              Set-Content -LiteralPath $summaryPath -Encoding utf8NoBOM
            "catalogUrl=$($outputs.catalogUrl)" | Add-Content $env:GITHUB_OUTPUT
          }
          finally {
            Pop-Location
          }

      - name: Publish deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-deploy
          path: evidence
          if-no-files-found: warn

  # -------------------------------------------------------------------------------
  # 5. run-migrations — main only. The Container Apps Job is the ONLY migration path;
  #    Catalog API never calls Database.Migrate() at startup.
  # -------------------------------------------------------------------------------
  run-migrations:
    name: Run Migrations
    needs: deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.migration.outputs.status }}
      executionName: ${{ steps.migration.outputs.executionName }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install pinned Pulumi CLI
        run: |
          set -euo pipefail
          curl -fsSL https://get.pulumi.com | sh -s -- --version "$PULUMI_VERSION"
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # `az containerapp` is an extension and is not preinstalled on the runner. Install it
      # explicitly so the migration step fails on real migration problems rather than on a
      # missing CLI extension or an interactive install prompt.
      - name: Install the containerapp Azure CLI extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Execute the database migrator Container Apps Job
        id: migration
        shell: pwsh
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          CATALOG_SQL_ADMIN_PASSWORD: ${{ secrets.CATALOG_SQL_ADMIN_PASSWORD }}
        run: |
          # The script starts the job, polls until completion and throws on any status
          # other than Succeeded, emitting only redacted diagnostic log lines.
          $result = ./scripts/run-migrations-dev.ps1
          New-Item -ItemType Directory -Path (Join-Path $PWD 'evidence') -Force | Out-Null
          $result | ConvertTo-Json -Depth 5 |
            Set-Content -LiteralPath (Join-Path $PWD 'evidence/migration-job.json') -Encoding utf8NoBOM
          "jobName=$($result.JobName)" | Add-Content $env:GITHUB_OUTPUT
          "executionName=$($result.ExecutionName)" | Add-Content $env:GITHUB_OUTPUT
          "status=$($result.Status)" | Add-Content $env:GITHUB_OUTPUT

      - name: Publish migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-migrations
          path: evidence
          if-no-files-found: warn

  # -------------------------------------------------------------------------------
  # 6. smoke-tests — main only, read-only GETs. Skipped automatically when migrations
  #    fail because this job needs run-migrations to succeed.
  # -------------------------------------------------------------------------------
  smoke-tests:
    name: Smoke Tests
    needs: run-migrations
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install pinned Pulumi CLI
        run: |
          set -euo pipefail
          curl -fsSL https://get.pulumi.com | sh -s -- --version "$PULUMI_VERSION"
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run read-only smoke tests
        shell: pwsh
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          CATALOG_SQL_ADMIN_PASSWORD: ${{ secrets.CATALOG_SQL_ADMIN_PASSWORD }}
        run: |
          # The URL is discovered from the Pulumi stack output, never hardcoded.
          # GET only: no POST, no permanent data, no Playwright.
          $result = ./scripts/smoke-test-dev.ps1
          New-Item -ItemType Directory -Path (Join-Path $PWD 'evidence') -Force | Out-Null
          $result | ConvertTo-Json -Depth 6 |
            Set-Content -LiteralPath (Join-Path $PWD 'evidence/smoke-tests.json') -Encoding utf8NoBOM

      - name: Publish smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-smoke
          path: evidence
          if-no-files-found: warn

  # -------------------------------------------------------------------------------
  # 7. publish-evidence — consolidates every job artifact plus a run manifest.
  #    Runs for pull requests too, so a PR keeps its preview evidence.
  # -------------------------------------------------------------------------------
  publish-evidence:
    name: Publish Evidence
    needs: [validate, infrastructure-preview, build-images, deploy, run-migrations, smoke-tests]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Download job evidence
        uses: actions/download-artifact@v4
        with:
          pattern: evidence-*
          path: catalog-evidence

      - name: Build run manifest
        shell: pwsh
        env:
          IMAGE_TAG: ${{ needs.build-images.outputs.imageTag }}
          API_IMAGE: ${{ needs.build-images.outputs.apiImage }}
          MIGRATOR_IMAGE: ${{ needs.build-images.outputs.migratorImage }}
          MIGRATION_STATUS: ${{ needs.run-migrations.outputs.status }}
          MIGRATION_RUN: ${{ needs.run-migrations.outputs.executionName }}
          DEPLOYED_URL: ${{ needs.deploy.outputs.catalogUrl }}
        run: |
          New-Item -ItemType Directory -Path catalog-evidence -Force | Out-Null
          # Run manifest. Deliberately contains no secrets, connection strings or
          # Key Vault values - only identifiers, image references and public results.
          $manifest = [pscustomobject]@{
            generatedAtUtc  = [DateTimeOffset]::UtcNow.ToString('O')
            sourceProvider  = 'github'
            orchestrator    = 'github-actions'
            repository      = '${{ github.repository }}'
            ref             = '${{ github.ref }}'
            eventName       = '${{ github.event_name }}'
            commitSha       = '${{ github.sha }}'
            runId           = '${{ github.run_id }}'
            runNumber       = '${{ github.run_number }}'
            runAttempt      = '${{ github.run_attempt }}'
            pulumiStack     = '${{ vars.PULUMI_STACK }}'
            pulumiBackend   = '${{ vars.PULUMI_BACKEND_URL }}'
            azureLocation   = '${{ vars.AZURE_LOCATION }}'
            azureAuth       = 'workload-identity-federation'
            imageTag        = $env:IMAGE_TAG
            apiImage        = $env:API_IMAGE
            migratorImage   = $env:MIGRATOR_IMAGE
            migrationRun    = $env:MIGRATION_RUN
            migrationStatus = $env:MIGRATION_STATUS
            deployedUrl     = $env:DEPLOYED_URL
          }
          $manifest | ConvertTo-Json -Depth 5 |
            Set-Content -LiteralPath catalog-evidence/run-manifest.json -Encoding utf8NoBOM
          $manifest | Format-List

      - name: Publish consolidated evidence
        uses: actions/upload-artifact@v4
        with:
          name: catalog-dev-deployment-evidence
          path: catalog-evidence
