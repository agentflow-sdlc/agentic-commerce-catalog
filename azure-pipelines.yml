trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release
  testResultsDirectory: $(Build.ArtifactStagingDirectory)/test-results

steps:
  - checkout: self
    clean: true
    fetchDepth: 0

  - task: UseDotNet@2
    displayName: Install .NET SDK from global.json
    inputs:
      packageType: sdk
      useGlobalJson: true

  - script: dotnet tool restore
    displayName: Restore repository tools

  - script: mkdir -p "$(testResultsDirectory)"
    displayName: Prepare diagnostic artifact directory

  - script: dotnet restore Catalog.sln
    displayName: Restore packages

  - script: dotnet build Catalog.sln --configuration $(buildConfiguration) --no-restore
    displayName: Build solution

  - script: >-
      dotnet test tests/Catalog.Product.Tests/Catalog.Product.Tests.csproj
      --configuration $(buildConfiguration)
      --no-build
      --logger "trx;LogFileName=Catalog.Product.Tests.trx"
      --results-directory "$(testResultsDirectory)"
    displayName: Run Product and Category unit tests

  - script: >-
      dotnet test tests/Catalog.Api.Tests/Catalog.Api.Tests.csproj
      --configuration $(buildConfiguration)
      --no-build
      --filter Category!=OpenApi
      --logger "trx;LogFileName=Catalog.Api.Tests.trx"
      --results-directory "$(testResultsDirectory)"
    displayName: Run API tests

  - script: >-
      dotnet test tests/Catalog.Architecture.Tests/Catalog.Architecture.Tests.csproj
      --configuration $(buildConfiguration)
      --no-build
      --logger "trx;LogFileName=Catalog.Architecture.Tests.trx"
      --results-directory "$(testResultsDirectory)"
    displayName: Run architecture tests

  - script: docker version
    displayName: Verify Docker for SQL Server integration tests

  - script: >-
      dotnet test tests/Catalog.Product.IntegrationTests/Catalog.Product.IntegrationTests.csproj
      --configuration $(buildConfiguration)
      --no-build
      --logger "trx;LogFileName=Catalog.Product.IntegrationTests.trx"
      --results-directory "$(testResultsDirectory)"
    displayName: Apply clean migration chain and run SQL Server integration tests
    env:
      RUN_SQL_SERVER_TESTS: "true"

  - script: >-
      dotnet ef migrations has-pending-model-changes
      --project src/Catalog.Accessors/Catalog.Accessors.csproj
      --startup-project src/Catalog.Api/Catalog.Api.csproj
      --configuration $(buildConfiguration)
      --no-build
    displayName: Validate EF Core migration model

  - script: >-
      dotnet ef migrations script --idempotent
      --project src/Catalog.Accessors/Catalog.Accessors.csproj
      --startup-project src/Catalog.Api/Catalog.Api.csproj
      --configuration $(buildConfiguration)
      --no-build
      --output "$(testResultsDirectory)/Catalog.Migrations.sql"
    displayName: Generate idempotent migration evidence

  - script: >-
      dotnet test tests/Catalog.Api.Tests/Catalog.Api.Tests.csproj
      --configuration $(buildConfiguration)
      --no-build
      --filter Category=OpenApi
      --logger "trx;LogFileName=Catalog.OpenApi.Tests.trx"
      --results-directory "$(testResultsDirectory)"
    displayName: Validate OpenAPI contract

  - script: dotnet format Catalog.sln --verify-no-changes --no-restore
    displayName: Verify formatting

  - task: PublishTestResults@2
    displayName: Publish test results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: "$(testResultsDirectory)/**/*.trx"
      failTaskOnFailedTests: true
      failTaskOnMissingResultsFile: false
      testRunTitle: Catalog .NET validation

  - task: PublishPipelineArtifact@1
    displayName: Publish failure diagnostics
    condition: failed()
    inputs:
      targetPath: $(testResultsDirectory)
      artifact: catalog-test-diagnostics
      publishLocation: pipeline
